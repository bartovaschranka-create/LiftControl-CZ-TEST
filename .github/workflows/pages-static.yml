name: Deploy static app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html sw.js zeppelin-game.js manifest.json dist/
          node scripts/build-public-test-data.cjs dist
          mkdir -p dist/assets/game
          cp assets/machine-passport.js assets/machine-passport.css assets/dispatch-ui.js dist/assets/
          cp assets/workspace-ui.js assets/workspace-ui.css dist/assets/
          cp assets/test-isolation.js dist/assets/
          cp assets/manager-map.js dist/assets/
          cp -r assets/silhouettes dist/assets/
          cp assets/game/zeppelin-cinematic-v2.png assets/game/bomb-cinematic-v2.png assets/game/prague-night-cinematic-v2.png dist/assets/game/
          cp icon-192.png icon-512.png icon-192-v4.png icon-512-v4.png apple-touch-icon-v4.png dist/
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
