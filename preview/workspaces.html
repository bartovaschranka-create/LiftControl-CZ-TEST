<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; form-action 'none'; base-uri 'none'">
<title>LiftControl CZ — offline návrh</title>
<style>
:root{--ink:#202124;--paper:#f7f6f2;--line:#deddd6;--yellow:#ffc400;--muted:#575a5e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Arial,sans-serif}button,input{font:inherit;color:inherit}button,a{touch-action:manipulation}button{min-height:44px;border:1px solid var(--line);border-radius:2px;background:transparent;padding:10px 16px;cursor:pointer}button:hover{background:#ecebe4}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #857000;outline-offset:3px}a{color:inherit}h1,h2,h3,p{margin:0}h1{font-size:42px;letter-spacing:-1.5px;line-height:1.15;margin:6px 0 10px}h2{font-size:19px;letter-spacing:-.4px}h3{font-size:14px}.notice{background:#e9e7df;text-align:center;padding:6px 20px;font-size:11px}.masthead{display:flex;align-items:center;gap:30px;padding:19px 32px;border-bottom:1px solid var(--line);background:#fff}.brand{font-size:27px;font-weight:800;letter-spacing:-1px;text-decoration:none;white-space:nowrap}.brand:before{content:'';display:inline-block;width:21px;height:28px;border-top:6px solid var(--yellow);border-left:6px solid var(--yellow);margin-right:12px;vertical-align:middle}.brand small{display:block;font:9px/1.2 Arial;letter-spacing:1.4px;margin-left:34px}.date{margin-left:auto;font-size:12px}.identity{font-size:11px;color:var(--muted);max-width:170px}.topnav{display:flex;padding:0 32px;background:#202124;color:#fff;gap:5px}.topnav button{border:0;color:inherit;border-radius:0;min-width:105px}.topnav button[aria-current=page]{background:var(--yellow);color:var(--ink);font-weight:bold}.topnav button:hover{background:#424342}.topnav button[aria-current=page]:hover{background:#f2bd00}main{max-width:1440px;margin:auto;padding:30px 32px 50px}.kicker{font-size:10px;letter-spacing:2px;font-weight:bold}.intro{color:var(--muted);margin-bottom:25px}.layout{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(260px,1fr);gap:24px}.column{min-width:0}.launches{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}.launch{background:#222526;color:#fff;padding:25px;min-height:185px;display:flex;flex-direction:column;align-items:flex-start}.launch h2{font-size:27px}.launch h2:after{content:'';display:block;width:38px;height:4px;background:var(--yellow);margin:10px 0}.launch p{font-size:13px;max-width:260px;color:#e1e1dc}.yellow,.launch button{background:var(--yellow);border-color:var(--yellow);color:var(--ink);font-weight:bold}.launch button{align-self:flex-end;margin-top:15px}.block{border:1px solid var(--line);margin-bottom:20px;background:#ffffff75;border-radius:3px;overflow:hidden}.blockhead{display:flex;align-items:center;gap:15px;justify-content:space-between;background:#eeede780;padding:14px 16px;border-bottom:1px solid var(--line)}.blockhead button{font-size:12px;padding:4px 8px;min-height:44px;border:0}.body{padding:16px}.muted{font-size:12px;color:var(--muted)}.stats{padding:4px 18px}.stat{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:12px 0;gap:15px}.stat:last-child{border:0}.stat strong{color:var(--ink);font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}.stat span{font-size:13px}.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:25px 0 20px;gap:4px}.tabs button{border:0;border-bottom:4px solid transparent;border-radius:0;font-size:12px;flex:1;padding:12px 10px}.tabs button[aria-current=page]{border-bottom-color:var(--yellow);background:#eeede5;font-weight:bold}.search{display:flex;gap:12px;margin:12px 0}.search input{width:100%;min-width:0;padding:12px;border:1px solid #c9c8c1;background:white;min-height:44px}.search button{white-space:nowrap}.rows{padding:0 16px}.row{display:grid;grid-template-columns:90px 1.1fr 1.2fr 1fr;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:12px;min-width:0}.row:last-child{border:0}.row span,.row strong{overflow-wrap:anywhere;min-width:0}.row button{padding:0;border:0;text-align:left;font-weight:bold;background:none}.row small{display:block;color:var(--muted);font-size:11px}.labels{font-size:10px;text-transform:uppercase;color:var(--muted);padding:10px 0}.badge{background:#eeece3;padding:4px 7px;font-size:11px;display:inline-block}.group{margin:12px 16px 0;padding:7px 12px;background:#eae9e4;font-size:13px;border-left:3px solid var(--yellow)}.group:first-of-type{background:#eee7e2}.actions{display:grid;gap:8px}.actions button{text-align:left;background:#fff;border-color:#d6d5cd;display:flex;justify-content:space-between;align-items:center}.actions button:after{content:'→'}.feedback{padding:12px 16px;background:#eeece1;border-left:3px solid var(--yellow);font-size:12px;margin-bottom:16px}.empty{padding:25px 16px;color:var(--muted);font-size:13px}.foot{color:var(--muted);font-size:11px;margin-top:20px}.passport{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}.specs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.specs div{border-bottom:1px solid var(--line);padding:10px 0}.specs small{display:block;color:var(--muted)}.placeholder{background:#eeede6;min-height:200px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.sectionnote{padding:12px 16px;font-size:12px;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:1000px){.layout{grid-template-columns:minmax(0,1.7fr) minmax(230px,1fr)}.masthead{gap:18px;padding:16px 22px}.row{grid-template-columns:80px 1fr 1fr}.row>:last-child{display:none}main{padding:25px 22px}.tabs button{flex:1 1 130px}.brand{font-size:23px}}
@media(max-width:700px){.masthead{flex-wrap:wrap;padding:16px;gap:12px}.brand{flex-basis:100%}.date{margin:0;font-size:11px}.identity{margin-left:auto;font-size:10px;max-width:130px}.masthead>button{display:none}.topnav{padding:0 8px}.topnav button{flex:1;min-width:0;font-size:12px;padding:12px 8px}main{padding:24px 16px}h1{font-size:32px}.intro{font-size:13px}.layout,.passport{grid-template-columns:1fr;gap:0}.launches{gap:10px}.launch{padding:17px 14px;min-height:215px}.launch h2{font-size:21px}.launch p{font-size:12px}.launch button{align-self:stretch;font-size:12px;padding:10px 6px;margin-top:auto}.blockhead{padding:10px 12px;gap:8px}.blockhead h2{font-size:17px}.blockhead button{font-size:11px;max-width:105px}.tabs{display:grid;grid-template-columns:1fr 1fr}.tabs button{font-size:12px;text-align:left}.row{grid-template-columns:75px minmax(0,1fr);gap:10px;padding:12px 0}.row>:nth-child(3){grid-column:2}.row>:last-child{display:none}.row.labels{display:none}.rows{padding:0 12px}.search{flex-wrap:wrap}.search button{width:100%}.stats{padding:0 16px}.stat{padding:10px 0}.notice{font-size:10px}.group{margin:12px 12px 0}.body{padding:12px}.foot{font-size:10px}}
</style></head><body>
<div class="notice">OFFLINE VIZUÁLNÍ NÁVRH · UKÁZKOVÁ DATA · BEZ FIREBASE A BEZ AUTENTIZACE</div>
<header class="masthead"><a class="brand" href="#home">LiftControl CZ<small>TECHNICKÁ EVIDENCE / CZ</small></a><div class="date"><strong id="today"></strong><br><span id="nameday"></span></div><div class="identity">Ukázkový režim<br>Bez autentizace</div><button data-demo="Nastavení">Nastavení</button></header>
<nav class="topnav" aria-label="Provozní prostředí"><button data-mode="home">Přehled</button><button data-mode="technician">Technik</button><button data-mode="manager">Vedoucí</button></nav>
<main id="app"></main><script>
// Deliberately isolated synthetic fixtures. No application import, persistence or network API.
const machines=[{id:'DEMO-001',model:'Ukázkový model A',place:'Areál A',date:'2026-10-19'},{id:'DEMO-002',model:'Ukázkový model B',place:'Areál B',date:'2026-10-23'},{id:'DEMO-003',model:'Ukázkový model C',place:'Areál C',date:'2026-10-30'}];
const menus={technician:['Vyhledávání stroje','Čtvrtletní kontroly','Závady','Opravy','Historie kontrol a oprav','Technické informace a dokumentace','QR skener'],manager:['Přehled strojů','Termíny kontrol','Otevřené závady','Stav a historie oprav','Provedené práce','Evidence strojů']};
let mode='home',tab=0,filter='',message='';
const block=(title,body,action='')=>`<section class="block"><div class="blockhead"><h2>${title}</h2>${action}</div>${body}</section>`;
const action=(label,index,role=mode)=>`<button data-mode="${role}" data-tab="${index}">${label} →</button>`;
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function machineRows(list=machines){return `<div class="rows"><div class="row labels"><span>Výrobní číslo</span><span>Model / typ</span><span>Místo</span><span>Podklady</span></div>${list.map(m=>`<div class="row"><span>${m.id}</span><button data-machine="${m.id}">${m.model}<small>Technický průkaz →</small></button><span>${m.place}</span><span>Ukázkový záznam</span></div>`).join('')}${list.length?'':'<p class="empty">Žádný ukázkový stroj neodpovídá hledání.</p>'}</div>`}
function terms(grouped=false){const groups=grouped?['Po termínu','Tento týden','Později']:['Nejbližší kontroly'];return groups.map((g,i)=>`${grouped?`<h3 class="group">${g}</h3>`:''}<div class="rows">${(grouped?[machines[i]]:machines).map(m=>`<div class="row"><strong>${m.date.split('-').reverse().join('. ')}</strong><span>${m.model}<small>${m.id}</small></span><span>Čtvrtletní kontrola</span><span>${m.place}</span></div>`).join('')}</div>`).join('')+'<p class="sectionnote">Ukázkové termíny pro ověření rozložení, nikoli aktuální agenda.</p>'}
function faults(){return '<div class="rows"><div class="row labels"><span>Nahlášeno</span><span>Stroj</span><span>Závada</span><span>Stav</span></div><div class="row"><span>20. 10. 2026</span><strong>Ukázkový model A<small>DEMO-001</small></strong><span>Ukázkový servisní požadavek</span><span><span class="badge">Čeká na opravu</span></span></div></div>'}
function stats(){return block('Rychlý přehled','<div class="stats">'+[['V ukázkové evidenci',3],['Po termínu',1],['Tento týden',1],['Otevřené závady',1],['Záznamy práce',2]].map(([label,n])=>`<div class="stat"><span>${label}</span><strong>${n}</strong></div>`).join('')+'</div><p class="sectionnote">Všechna čísla jsou pouze ukázková.</p>')}
function work(){return '<div class="rows"><div class="row"><span>20. 10.</span><strong>Ukázkový model A</strong><span>Ukázková kontrola</span><span>DEMO</span></div><div class="row"><span>19. 10.</span><strong>Ukázkový model B</strong><span>Ukázková oprava</span><span>DEMO</span></div></div>'}
function quick(){return block('Rychlé akce','<div class="body actions">'+['Provést kontrolu','Zapsat závadu','Zahájit opravu','Technické informace'].map((s,i)=>`<button data-mode="technician" data-tab="${[1,2,3,5][i]}">${s}</button>`).join('')+'</div>')}
function render(){document.querySelectorAll('[data-mode]').forEach(b=>{if(b.closest('.topnav')){if(b.dataset.mode===mode)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}});let html='<div class="kicker">LIFTCONTROL CZ / PRACOVNÍ PROSTŘEDÍ</div>';
if(mode==='home'){html+='<h1>Přehled provozu</h1><p class="intro">Rychlý přehled techniky, termínů a pracovních úkonů.</p><div class="layout"><div class="column"><div class="launches">'+[['technician','TECHNIK','Stroje, kontroly, závady, opravy a technická dokumentace.'],['manager','VEDOUCÍ','Termíny, přehled techniky a provedené práce.']].map(([key,title,desc])=>`<section class="launch"><h2>${title}</h2><p>${desc}</p>${action('Otevřít',key==='manager'?1:0,key)}</section>`).join('')+'</div>'+block('Nejbližší termíny kontrol',terms(),action('Zobrazit všechny',1,'manager'))+block('Otevřené závady',faults(),action('Zobrazit všechny',2,'manager'))+'</div><aside>'+stats()+block('Poslední provedené práce',work(),action('Zobrazit všechny',4,'manager'))+quick()+'</aside></div>'}
else{html+=`<h1>${mode==='technician'?'Technik':'Vedoucí'}</h1><p class="intro">${mode==='technician'?'Konkrétní stroj, kontrola, závada nebo oprava.':'Termíny, otevřené požadavky a přehled provedené práce.'}</p><nav class="tabs" aria-label="Pracovní podkarty">${menus[mode].map((s,i)=>`<button data-section="${i}" ${tab===i?'aria-current="page"':''}>${s}</button>`).join('')}</nav>${message?`<p class="feedback" role="status">${escapeText(message)}</p>`:''}<div class="layout"><div class="column">`;
const name=menus[mode][tab];
if((mode==='technician'&&tab===0)||(mode==='manager'&&(tab===0||tab===5))){html+=block(mode==='technician'?'Vyhledání stroje':'Evidence strojů',`<div class="body"><label for="search">Výrobní číslo, model nebo místo</label><div class="search"><input id="search" value="${escapeText(filter)}" placeholder="Vyhledat v ukázkové evidenci…"><button class="yellow" id="searchButton">Vyhledat →</button></div><p class="muted">Naposledy otevřené stroje nejsou v této ukázce sledovány.</p></div>`)+block('Stroje v evidenci',machineRows(machines.filter(m=>(m.id+' '+m.model+' '+m.place).toLowerCase().includes(filter.toLowerCase()))))}
else if(mode==='manager'&&tab===1)html+=block('Nejbližší termíny',terms(true),'<button data-demo="Úplná evidence termínů">Zobrazit všechny →</button>')+block('Otevřené závady',faults(),action('Zobrazit všechny',2));
else if((mode==='technician'&&tab===2)||(mode==='manager'&&tab===2))html+=block(name,faults())+block('Práce se závadou','<div class="body actions"><button data-demo="Nahlásit závadu">Nahlásit závadu</button><button data-demo="Archiv závad">Archiv závad</button></div>');
else if((mode==='technician'&&tab===4)||(mode==='manager'&&tab===4))html+=block(name,work())+block('Úplná historie','<div class="body actions"><button data-demo="Historie kontrol">Historie kontrol</button><button data-demo="Historie oprav">Historie oprav</button></div>');
else if(mode==='technician'&&tab===5)html+=block(name,'<div class="body"><p class="muted">Technické hodnoty a pracovní obálky nejsou ve fixture datech doloženy. V náhledu je nedoplňujeme.</p><div class="actions"><button data-demo="Dokumentace">Otevřít dokumentaci</button><button data-demo="Technická infolinka">Technická infolinka</button></div></div>');
else if(mode==='technician'&&tab===6)html+=block(name,'<div class="body"><p>Offline návrh neaktivuje kameru.</p><div class="actions"><button data-demo="QR skener">Otevřít QR skener</button></div></div>');
else html+=block(name,'<div class="body"><p class="muted">Prezentace podkarty. Formuláře, přílohy a ukládání budou připojeny až po schválení k původním funkcím.</p><div class="actions"><button data-demo="'+name+'">'+(tab===1?'Nová čtvrtletní kontrola':'Zapsat opravu')+'</button><button data-demo="Archiv">Otevřít archiv</button></div></div>');
html+='</div><aside>'+stats()+(mode==='manager'?block('Poslední provedené práce',work()):quick())+block('Pracovní režim','<p class="sectionnote">Volba prostředí není oprávnění. Správa uživatelů není dostupná bez doloženého modelu přihlášení.</p>')+'</aside></div>'}
document.getElementById('app').innerHTML=html+'<p class="foot">Ukázkový režim • Bez ukládání, skutečných fotografií a technických hodnot. Revizní pracoviště zůstává v původní aplikaci samostatně; tento návrh do něj nezasahuje.</p>';
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode){mode=b.dataset.mode;tab=Number(b.dataset.tab||0);filter='';message='';render()}else if(b.dataset.section!==undefined){tab=Number(b.dataset.section);message='';render()}else if(b.id==='searchButton'){filter=document.getElementById('search').value;render()}else if(b.dataset.demo){message=b.dataset.demo+': pouze offline ukázka. Žádná data se neukládají.';if(mode==='home'){mode='technician';tab=0}render()}else if(b.dataset.machine){const m=machines.find(m=>m.id===b.dataset.machine);document.getElementById('app').innerHTML=`<button id="back">← Zpět na stroje</button><p class="kicker" style="margin-top:24px">DIGITÁLNÍ TECHNICKÝ PRŮKAZ / UKÁZKA</p><h1>${m.model}</h1><p class="intro">${m.id} · ${m.place}</p><div class="passport"><div>${block('Identifikace stroje','<div class="body specs"><div><small>Výrobní číslo</small>'+m.id+'</div><div><small>Rok výroby</small>Nedoložen</div><div><small>Nosnost</small>Nedoložena</div><div><small>Dosah</small>Nedoložen</div></div>')}${block('Historie',work())}</div><div>${block('Fotografie','<div class="placeholder">Fotografie není v ukázkových datech dostupná.</div>')}${block('Pracovní obálka','<p class="empty">Doložená pracovní obálka není k dispozici.</p>')}</div></div>`}else if(b.id==='back')render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='search'){filter=e.target.value;render()}});
document.querySelector('.brand').addEventListener('click',()=>{mode='home';tab=0;render()});
const now=new Date();document.getElementById('today').textContent=now.toLocaleDateString('cs-CZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
// Reuse the application's calendar when packaged by the preview builder. No second calendar.
document.getElementById('nameday').textContent='Svátek: ' + (window.PREVIEW_NAMEDAY || 'v tomto samostatném souboru není načten');
const initial=location.hash.slice(1);if(menus[initial]){mode=initial;tab=mode==='manager'?1:0}render();
</script></body></html>
